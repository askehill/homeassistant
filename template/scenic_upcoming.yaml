# Upcoming Scenic bookings as a plain list for the dashboard.
# State = number of upcoming/current bookings; attribute `bookings` holds the
# list (soonest first) with local-time start/end strings.
- triggers:
    - trigger: time_pattern
      minutes: "/15"
    - trigger: homeassistant
      event: start
    - trigger: calendar
      event: start
      entity_id: calendar.scenic_2011
    - trigger: calendar
      event: end
      entity_id: calendar.scenic_2011
    - trigger: event
      event_type: scenic_booking_created
  actions:
    - action: calendar.get_events
      target:
        entity_id: calendar.scenic_2011
      data:
        start_date_time: "{{ now().isoformat() }}"
        end_date_time: "{{ (now() + timedelta(days=60)).isoformat() }}"
      response_variable: result
    - variables:
        bookings: >-
          {% set ns = namespace(l=[]) %}
          {%- for ev in result['calendar.scenic_2011'].events | sort(attribute='start') %}
            {%- set s = as_local(as_datetime(ev.start)) %}
            {%- set e = as_local(as_datetime(ev.end)) %}
            {%- set ns.l = ns.l + [{
              'who': ev.summary,
              'start': s.strftime('%a %d %b %H:%M'),
              'end': e.strftime('%H:%M') if s.date() == e.date() else e.strftime('%a %d %b %H:%M')
            }] %}
          {%- endfor %}
          {{ ns.l }}
  sensor:
    - unique_id: scenic_upcoming_bookings
      name: Scenic Upcoming Bookings
      state: "{{ bookings | length }}"
      attributes:
        bookings: "{{ bookings }}"
