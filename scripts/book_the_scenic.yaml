book_the_scenic:
  alias: Book the Scenic
  mode: single
  sequence:
    - variables:
        start: "{{ states('input_datetime.scenic_start') }}"
        end: "{{ states('input_datetime.scenic_end') }}"
        # Who pressed the button: match the logged-in user to a person entity
        # (person name must equal a key in notify_map). Falls back to the
        # dropdown if the caller isn't a person (e.g. run from an automation).
        who: >-
          {% set uid = context.user_id %}
          {% set p = (states.person | selectattr('attributes.user_id', 'eq', uid)
                      | map(attribute='name') | list) if uid else [] %}
          {{ p[0] if p else states('input_select.scenic_booker') }}
        note: "{{ states('input_text.scenic_note') | trim }}"
        notify_map:
          Adrian: notify.mobile_app_cph2581
          Finn: notify.mobile_app_sm_s921b
          Davin: notify.mobile_app_sm_g780f
        notify_service: "{{ notify_map.get(who, 'persistent_notification.create') }}"
        problem: >-
          {% set bad = ['unknown', 'unavailable', ''] %}
          {% if who in bad %}
            Pick who is booking the car.
          {% elif start in bad or end in bad %}
            Set both a start and an end time.
          {% elif as_timestamp(end) <= as_timestamp(start) %}
            The end time must be after the start time.
          {% elif as_timestamp(start) < as_timestamp(now()) - 300 %}
            That start time is in the past.
          {% endif %}
    - if:
        - condition: template
          value_template: "{{ problem | trim != '' }}"
      then:
        - action: "{{ notify_service }}"
          data:
            title: "Scenic booking not made"
            message: "{{ problem | trim }}"
        - stop: "Invalid booking"
    - action: calendar.get_events
      target:
        entity_id: calendar.scenic_2011
      data:
        start_date_time: "{{ start }}"
        end_date_time: "{{ end }}"
      response_variable: clash
    - if:
        - condition: template
          value_template: "{{ clash['calendar.scenic_2011'].events | length > 0 }}"
      then:
        - action: "{{ notify_service }}"
          data:
            title: "Scenic already booked"
            message: >-
              Sorry {{ who }}, that clashes with
              "{{ clash['calendar.scenic_2011'].events[0].summary }}".
              Pick another time.
        - stop: "Clash"
    - action: calendar.create_event
      target:
        entity_id: calendar.scenic_2011
      data:
        summary: "{{ who }}{{ ' - ' ~ note if note not in ['', 'unknown'] else '' }}"
        start_date_time: "{{ start }}"
        end_date_time: "{{ end }}"
    - event: scenic_booking_created
    - action: input_text.set_value
      target:
        entity_id: input_text.scenic_note
      data:
        value: ""
    - action: "{{ notify_service }}"
      data:
        title: "Scenic booked"
        message: "{{ who }}: {{ start }} to {{ end }}"
